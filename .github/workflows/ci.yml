#
# CI (proposal §4.5, §4.6b). Every job runs the same command an agent runs locally.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash # -eo pipefail

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only one open PR at a time may add Flyway migrations (AGENTS.md §1); the oldest one holds the lock,
  # and new migration versions must be newer than the base branch's. Runs the BASE branch's copy of the
  # script (it only needs the API), so a PR cannot edit the check that judges it.
  migration-lock:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: At most one open PR adds migrations, with versions newer than the base branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ ! -f .github/scripts/migration-lock.sh ]]; then
            # Only the PR that introduces the script meets a base without it.
            echo "::warning::The base branch has no migration-lock.sh yet; nothing to run."
            exit 0
          fi
          bash .github/scripts/migration-lock.sh "$PR_NUMBER"

  # Tests for the CI scripts themselves (this PR's copy).
  ci-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: migration-lock.sh tests (stubbed gh)
        run: bash .github/scripts/migration-lock.test.sh

  # Breaking changes to the API contract (api/openapi.json) against the base branch fail the PR (ADR-0033).
  # Human-only override: an entry in .github/oasdiff/breaking-changes-allowed.txt, read from the BASE
  # branch, so a PR cannot approve its own break; Lucas lands the entry on main first. The PR that uses an
  # entry must delete it (checked here and on push to main). Edits to this job itself are only covered by
  # the protected-path review of .github/.
  api-breaking-changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # Bump both together: https://github.com/oasdiff/oasdiff/releases (checksums.txt)
      OASDIFF_VERSION: 1.32.1
      OASDIFF_SHA256: 7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f
      ALLOWLIST: .github/oasdiff/breaking-changes-allowed.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: |
            api
            .github/oasdiff
          persist-credentials: false
      - name: Install oasdiff (checksum-verified release binary)
        if: github.event_name == 'pull_request'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/oasdiff.tar.gz" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP" oasdiff
      - name: No breaking changes unless approved on the base branch
        if: github.event_name == 'pull_request'
        run: |
          if [[ ! -f base/api/openapi.json ]]; then
            # Only the PR that introduces the contract meets a base without it.
            echo "::notice::The base branch has no api/openapi.json yet; nothing to compare."
            exit 0
          fi
          # oasdiff treats every line as a rule, comments included.
          touch "$RUNNER_TEMP/allowed.txt"
          if [[ -f "base/$ALLOWLIST" ]]; then
            grep -v -E '^[[:space:]]*(#|$)' "base/$ALLOWLIST" > "$RUNNER_TEMP/allowed.txt" || true
          fi
          "$RUNNER_TEMP/oasdiff" breaking base/api/openapi.json api/openapi.json \
            --fail-on ERR \
            --err-ignore "$RUNNER_TEMP/allowed.txt" \
            --format singleline
      - name: A PR that changes the contract deletes the approvals it used
        if: github.event_name == 'pull_request'
        run: |
          if cmp -s base/api/openapi.json api/openapi.json; then exit 0; fi
          if grep -q -v -E '^[[:space:]]*(#|$)' "$ALLOWLIST"; then
            echo "::error file=$ALLOWLIST::This PR changes api/openapi.json; delete the approved entries from $ALLOWLIST in it."
            exit 1
          fi
      - name: No approvals left on main after a contract change
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || git diff --quiet "$BEFORE" HEAD -- api/openapi.json; then
            exit 0
          fi
          if grep -q -v -E '^[[:space:]]*(#|$)' "$ALLOWLIST"; then
            echo "::error file=$ALLOWLIST::api/openapi.json changed on main while $ALLOWLIST still has entries; delete them."
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0 (also validates the wrapper)
      - name: Build, detekt, ktlint, tests, architecture tests, coverage, licences
        run: ./gradlew check
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-reports
          path: backend/**/build/reports
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs pnpm (version from frontend/package.json's packageManager field, signature-checked),
      # Node.js, and runs `pnpm install --frozen-lockfile` in frontend/.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          working-directory: frontend
          runtime: node@24 # current LTS line; keep in sync with engines.node
          cache: true
          require-lockfile: true
      - name: Lint, types, unit tests, build, licences
        run: pnpm check
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Headless e2e with axe
        run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  compose:
    # Builds the image and smoke-tests the compose stack (issue #15, ADR-0029).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image, start the stack, check health, ports, users, read-only FS
        run: |
          cp .env.example .env
          scripts/compose-smoke-test.sh

  review-lenses:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests for the lens scripts
        run: python3 -m unittest discover -s .review/tests
      - name: Lens fixtures are well-formed and apply to this tree
        run: python3 .review/selftest.py validate
