# Single source of truth for every version in the backend build.
# Rule (docs/spec/04-tech-stack-proposal.md 4.10): look up the latest stable version at the
# official source and read its current docs before adding or bumping anything here.

[versions]
kotlin = "2.4.20"
spring-boot = "4.1.1"
spring-modulith = "2.1.1"
junit = "6.1.3"
kotest = "6.2.5"
mockk = "1.14.11"
archunit = "1.5.1"
konsist = "0.17.3"
# Pre-release by documented exception: detekt 1.23.x only supports Kotlin <= 2.0.
detekt = "2.0.0-alpha.6"
spotless = "8.10.3"
ktlint = "1.8.0"
kover = "0.9.11"
licensee = "1.14.1"
# Newer than the Spring Boot BOM (jOOQ 3.21.7, Flyway 12.4.0); the explicit version wins in Gradle.
jooq = "3.21.8"
flyway = "13.7.0"

# Security overrides (OSV, 2026-09-30): transitive versions with known CVEs, raised to the patched release.
# Remove each once the managing BOM/plugin ships the fix (the osv-scanner job will tell).
tomcat-patched = "11.0.26"
jackson3-patched = "3.1.7"
commons-lang3-patched = "3.21.0"
plexus-utils-patched = "3.6.2"
freemarker-patched = "2.3.35"

[libraries]
security-tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat-patched" }
security-jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3-patched" }
security-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3-patched" }
security-plexus-utils = { module = "org.codehaus.plexus:plexus-utils", version.ref = "plexus-utils-patched" }
security-freemarker = { module = "org.freemarker:freemarker", version.ref = "freemarker-patched" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-actuator-test = { module = "org.springframework.boot:spring-boot-starter-actuator-test" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
spring-modulith-core = { module = "org.springframework.modulith:spring-modulith-core" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }

# Persistence (adapters/persistence). PostgreSQL driver and Testcontainers versions come from the Boot BOM.
spring-boot-starter-jooq = { module = "org.springframework.boot:spring-boot-starter-jooq" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-codegen = { module = "org.jooq:jooq-codegen", version.ref = "jooq" }
jooq-meta = { module = "org.jooq:jooq-meta", version.ref = "jooq" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
