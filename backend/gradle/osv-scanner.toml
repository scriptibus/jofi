effectiveUntil = 2026-12-31
reason = "Only .pom/.module metadata is listed (anthropic-java-core 2.52.0 declares it; the security constraint on jackson-databind aligns Jackson 2 to 2.22.3 on every classpath). No 2.19.4 jar is used."

