# The `worker` container (compose.yaml: same image, SPRING_PROFILES_ACTIVE=worker, no published
# port): runs the JobRunr background job server (ADR-0010, ADR-0038). The startup checks of `app`
# (master keyset, password reset, setup token) and the registration of schedules are off here.
jobrunr:
  background-job-server:
    enabled: true
    # A single user's jobs: a few at a time keep memory, provider rate limits and the AI budget calm.
    worker-count: 4
