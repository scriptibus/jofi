spring:
  application:
    name: jofi
  autoconfigure:
    # Jofi has its own login (AuthController); Boot's fallback in-memory user would log a generated
    # password at startup.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # Every error response is RFC 9457 problem details (application/problem+json), the one error
  # schema of the API contract (api/openapi.json, ADR-0016).
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  # PostgreSQL from the environment. Never put credentials in this file or in the URL.
  datasource:
    url: ${JOFI_DB_URL:jdbc:postgresql://localhost:5432/jofi}
    username: ${JOFI_DB_USERNAME:jofi}
    # No default: startup fails without it (DatabasePasswordGuard).
    password: ${JOFI_DB_PASSWORD}
  jooq:
    sql-dialect: postgres
  # Login sessions live in PostgreSQL (tables from the Flyway migration), so they survive restarts.
  session:
    # Idle timeout; the absolute lifetime since login is jofi.auth.session-max-age.
    timeout: ${JOFI_SESSION_TIMEOUT:7d}
    jdbc:
      initialize-schema: never
      # Expired sessions are deleted by the hourly `session-cleanup` job in the worker (#17), so the
      # app runs no background work of its own.
      cleanup-cron: "-"

server:
  # Localhost only by default (ADR-0029). The container image binds to all interfaces and relies on
  # the compose port mapping, which is localhost-only unless JOFI_BIND_ADDRESS (compose) says otherwise.
  address: ${JOFI_SERVER_ADDRESS:127.0.0.1}
  # Behind a TLS-terminating proxy (Caddy, Tailscale serve) the request counts as HTTPS, so session
  # and CSRF cookies get the Secure flag. X-Forwarded-* is trusted only from the proxies listed in
  # JOFI_TRUSTED_PROXIES (CIDRs, default loopback only): Tomcat's default trusts every private range,
  # which would let LAN clients fake their address and dodge the per-client login backoff.
  # The session cookie flags are set in SecurityConfiguration (HttpOnly, SameSite=Lax, Secure on HTTPS).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${JOFI_TRUSTED_PROXIES:127.0.0.0/8, ::1/128}

jofi:
  # The data volume: master keyset and setup token (owner-only files), knowledge/ and documents/, and
  # backup-work/ for exports and restores in progress.
  # Must be an absolute path; no default, so a working directory never decides where keys go
  # (/data in the container image).
  data-dir: ${JOFI_DATA_DIR:}
  auth:
    # Absolute lifetime of a login session, however active it is.
    session-max-age: ${JOFI_SESSION_MAX_AGE:30d}
    # Password recovery: `true` deletes the account at startup, ends every session and issues a new
    # setup token. Remove it again afterwards, or every restart resets the password.
    reset-password: ${JOFI_RESET_PASSWORD:false}
  secrets:
    # `true` accepts that a lost or different master keyset makes the stored secrets unreadable.
    accept-loss: ${JOFI_ACCEPT_SECRET_LOSS:false}
  # URL import (ADR-0051): how many pages may be fetched at once, however many links are submitted. Each fetch can
  # buffer 1 MiB and take 20 s; a request over the cap answers 429 import-busy at once. Must be positive.
  import:
    max-concurrent-fetches: ${JOFI_IMPORT_MAX_CONCURRENT_FETCHES:3}
  # Backup and restore (ADR-0042). Limits for an uploaded backup: the upload itself, everything it
  # unpacks to (zip bombs) and its number of entries. Unpacking needs that much free space in the data volume.
  backup:
    max-upload-size: ${JOFI_BACKUP_MAX_UPLOAD_SIZE:2GB}
    max-unpacked-size: ${JOFI_BACKUP_MAX_UNPACKED_SIZE:8GB}
    max-entries: ${JOFI_BACKUP_MAX_ENTRIES:100000}

# Background jobs (ADR-0010, ADR-0038): JobRunr on the Flyway-managed tables. `app` only enqueues; the
# `worker` profile (application-worker.yaml) runs the background job server.
jobrunr:
  background-job-server:
    enabled: false
    # Carbon-aware processing would call api.jobrunr.io outside adapters/net (ADR-0034); off everywhere.
    carbon-aware-job-processing:
      enabled: false
  # JobRunr's own dashboard stays off: it would open a second, unauthenticated web server. The job log
  # is GET /api/system/jobs behind the login.
  dashboard:
    enabled: false
  miscellaneous:
    # No telemetry (AGENTS.md section 6).
    allow-anonymous-data-usage: false
  jobs:
    # A failed run is retried after 3^n seconds (3 s, 9 s, 27 s, ... about 16 h for the 10th retry).
    default-number-of-retries: 10
    retry-back-off-time-seed: 3

# Apache HttpClient logs request lines, headers and bodies at DEBUG; those can hold API keys and
# personal data (threat model T4), so they stay off even when the root level is lowered.
logging:
  level:
    org.apache.hc.client5.http: info
    org.apache.hc.client5.http.headers: "off"
    org.apache.hc.client5.http.wire: "off"
    # Spring AI logs prompts, tool arguments and embedding inputs in some paths (even at WARN), and
    # the vendor SDKs can log bodies. The AI adapter logs provider, model and result kind itself.
    org.springframework.ai: "off"
    com.openai: "off"
    com.anthropic: "off"
    # The MCP SDK logs messages at DEBUG and parser errors (which can quote tool arguments) at ERROR; the
    # Spring AI MCP transport is already off above. McpToolSpecifications logs tool failures without content.
    io.modelcontextprotocol: "off"

management:
  endpoints:
    web:
      exposure:
        include: health
