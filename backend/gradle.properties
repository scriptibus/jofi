org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# The Kotlin daemon otherwise inherits the 2g above; with the AI adapter's Spring AI classpath, the
# CodeQL-traced compile of the generated jOOQ code runs out of it. A user's ~/.gradle/gradle.properties wins.
kotlin.daemon.jvmargs=-Xmx3g
kotlin.code.style=official
version=0.1.0-SNAPSHOT
# PostgreSQL + pgvector image used by Testcontainers (integration tests, jOOQ codegen, bootTestRun).
# Pinned by the digest of the multi-arch index; bump tag and digest together.
jofi.postgresImage=pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
