# Supply-chain settings (docs: https://pnpm.io/10.x/settings)
# Only resolve versions that have been public for at least this many minutes.
minimumReleaseAge: 10080 # 7 days, same as Renovate
# Fail the install if a dependency has build scripts we have not reviewed.
strictDepBuilds: true
# Install-script allowlist (replaces the deprecated onlyBuiltDependencies).
allowBuilds: {}
strictPeerDependencies: true
