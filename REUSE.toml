# SPDX-FileCopyrightText: 2026 Jofi contributors
# SPDX-License-Identifier: AGPL-3.0-or-later
# Licensing for files that can't carry a comment header (JSON, lockfiles, generated files, images).
# Source files carry their own SPDX header; see AGENTS.md section 4.
version = 1

[[annotations]]
path = [
  "**/*.json",
  "**/*.lock",
  "**/*.lockfile",
  "**/pnpm-lock.yaml",
  "**/gradle/verification-metadata.xml",
  "**/gradle/wrapper/**",
  "**/gradlew",
  "**/gradlew.bat",
  "**/*.png",
  "**/*.svg",
  "**/*.ico",
  "**/*.webmanifest",
  ".review/fixtures/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jofi contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The planning spec is kept verbatim; it quotes SPDX tags in prose, so its own text must not be parsed.
[[annotations]]
path = "docs/spec/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Jofi contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
